<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Convoy</title>
<!-- Always dark, regardless of the dashboard's light/dark preference --
     same call ArgoCD's own login screen makes. There's no session yet to
     have a per-user preference tied to, and the scene below (glows, radar
     sweep, status blips) is tuned for a dark background only. -->
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="icon" href="./login-owl.png">
<style>
  :root {
    --ink: #0c0c10; --panel: #17171d; --inset: #101014; --line: #26262e;
    --text: #e7e7ea; --fog: #8c8c96;
    --signal: #8b5cf6; --signal-deep: #6d28d9;
    --arrived: #2fb673; --down: #e5484d; --rolling: #d99a3d;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --display: 'Space Grotesk', var(--sans);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--sans); background: var(--ink); color: var(--text); }

  .split { display: flex; min-height: 100vh; }

  .brand-side { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; background: var(--ink); }
  /* Faint dot starfield -- cheap depth without an image request. */
  .brand-side::before { content: ''; position: absolute; inset: 0; opacity: 0.5;
    background-image: radial-gradient(rgba(255,255,255,0.35) 1px, transparent 1px);
    background-size: 34px 34px; }
  .brand-glow { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(90px); }
  .brand-glow.a { width: 480px; height: 480px; top: -160px; left: 20%;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.35), transparent 70%); }
  .brand-glow.b { width: 380px; height: 380px; bottom: -140px; right: 15%;
    background: radial-gradient(circle, rgba(109, 40, 217, 0.3), transparent 70%); }
  /* The hero scene: concentric rings, a rotating radar sweep masked to a
     ring, a handful of pulsing status-colored blips (reusing the app's own
     arrived/down/rolling vocabulary, not arbitrary decoration colors), and
     the real owl icon breathing in the center. Swap the whole <div
     class="scope">...</div> for a single designed image later if/when one
     exists -- this is a placeholder for that, not a permanent commitment
     to building scenes out of CSS. */
  .scope { position: relative; z-index: 1; width: 300px; height: 300px;
    display: flex; align-items: center; justify-content: center; }
  .scope .rings { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scope .rings circle { fill: none; stroke: var(--signal); }
  .sweep { position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(139, 92, 246, 0.22) 40deg, transparent 75deg);
    -webkit-mask: radial-gradient(circle, transparent 28%, #000 29%);
    mask: radial-gradient(circle, transparent 28%, #000 29%);
    animation: sweep 7s linear infinite; }
  @keyframes sweep { to { transform: rotate(360deg); } }
  .scope .owl { position: relative; z-index: 2; width: 108px; height: 108px;
    animation: breathe 4.5s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 0 24px rgba(139, 92, 246, 0.4)); }
    50% { filter: drop-shadow(0 0 40px rgba(139, 92, 246, 0.7)); }
  }
  .blip { position: absolute; width: 7px; height: 7px; border-radius: 50%;
    animation: blip-pulse 2.6s ease-in-out infinite; }
  @keyframes blip-pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .sweep, .scope .owl, .blip { animation: none; }
  }

  .brand-side .word { font-family: var(--display); font-size: 34px; font-weight: 700;
    letter-spacing: 0.1em; position: relative; z-index: 1; margin-top: 4px; }
  .brand-side .tag { font-family: var(--display); font-weight: 600; color: var(--fog);
    font-size: 15px; position: relative; z-index: 1; }
  .brand-side .tag .grad { color: var(--signal); }
  .brand-side .desc { color: var(--fog); font-size: 13px; text-align: center; max-width: 300px;
    position: relative; z-index: 1; line-height: 1.5; }

  .form-side { width: 420px; flex-shrink: 0; background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; justify-content: center; padding: 40px; gap: 22px; }
  .form-side h1 { font-size: 22px; font-weight: 700; line-height: 1.3; }
  .form-side .sub { color: var(--fog); font-size: 13px; margin-top: 6px; }

  button.sso { display: none; align-items: center; justify-content: center; gap: 8px; width: 100%;
    padding: 11px 16px; border-radius: 7px; border: 1px solid var(--line); background: var(--inset);
    color: var(--text); font-size: 13.5px; font-weight: 600; cursor: pointer; }
  button.sso:hover { border-color: var(--signal); }
  button.sso.show { display: flex; }
  button.sso svg { flex-shrink: 0; }

  .divider { display: none; align-items: center; gap: 10px; color: var(--fog); font-size: 12px; }
  .divider.show { display: flex; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  form { display: flex; flex-direction: column; gap: 10px; }
  label { font-size: 12.5px; font-weight: 600; color: var(--fog); }
  .field { position: relative; }
  .field svg.lead { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--fog); }
  .field input { background: var(--inset); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 10px 40px; font-size: 13.5px; font-family: var(--sans); width: 100%; }
  .field input:focus { outline: none; border-color: var(--signal); }
  .field button.toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; padding: 4px; color: var(--fog); cursor: pointer; display: flex; }
  .field button.toggle:hover { color: var(--text); }

  button.submit { margin-top: 4px; padding: 11px 16px; border-radius: 7px; border: none;
    background: var(--signal); color: #fff; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  button.submit:hover { background: var(--signal-deep); }
  button.submit:disabled { opacity: 0.6; cursor: default; }

  .error { display: none; color: var(--down); font-size: 12.5px; font-weight: 600; }
  .error.show { display: block; }

  .form-footer { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 8px; }
  .form-footer .brand { display: flex; align-items: center; gap: 6px; color: var(--fog); font-size: 12px; font-weight: 700; }
  .form-footer .brand img { width: 16px; height: 16px; }
  .form-footer .copy { color: var(--fog); font-size: 11px; opacity: 0.7; }
</style>
</head>
<body>

<div class="split">
  <div class="brand-side">
    <div class="brand-glow a"></div>
    <div class="brand-glow b"></div>
    <div class="scope">
      <div class="sweep"></div>
      <svg class="rings" viewBox="0 0 300 300" aria-hidden="true">
        <circle cx="150" cy="150" r="86" stroke-width="1" opacity="0.24"/>
        <circle cx="150" cy="150" r="118" stroke-width="1" opacity="0.15"/>
        <circle cx="150" cy="150" r="146" stroke-width="1" opacity="0.09"/>
      </svg>
      <span class="blip" style="left:65%;top:24%;background:var(--arrived);animation-delay:0s"></span>
      <span class="blip" style="left:26%;top:33%;background:var(--arrived);animation-delay:.4s"></span>
      <span class="blip" style="left:76%;top:49%;background:var(--rolling);animation-delay:.9s"></span>
      <span class="blip" style="left:33%;top:72%;background:var(--arrived);animation-delay:1.3s"></span>
      <span class="blip" style="left:15%;top:55%;background:var(--down);animation-delay:.2s"></span>
      <span class="blip" style="left:65%;top:76%;background:var(--arrived);animation-delay:1.7s"></span>
      <span class="blip" style="left:48%;top:13%;background:var(--arrived);animation-delay:.7s"></span>
      <img class="owl" src="./login-owl.png" alt="">
    </div>
    <span class="word">CONVOY</span>
    <span class="tag">Every pipeline, <span class="grad">live.</span></span>
    <p class="desc">Self-hosted, real-time visibility for every deploy and pipeline across your org.</p>
  </div>

  <div class="form-side">
    <div>
      <h1>Welcome back 👋</h1>
      <div class="sub">Sign in to continue to Convoy.</div>
    </div>

    <button class="sso" id="ssoBtn" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a5 5 0 0 0-5 5v3H6a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1h-1V7a5 5 0 0 0-5-5Zm3 8H9V7a3 3 0 0 1 6 0Z"/></svg>
      <span id="ssoLabel"></span>
    </button>
    <div class="divider" id="divider"><span>or</span></div>

    <form id="loginForm">
      <label for="password">Access key</label>
      <div class="field">
        <svg class="lead" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input type="password" id="password" name="password" placeholder="Enter your access key" autocomplete="current-password" autofocus required>
        <button class="toggle" id="toggleVis" type="button" aria-label="Show password">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="error" id="error">That key isn't right — try again.</div>
      <button class="submit" id="submitBtn" type="submit">Sign in</button>
    </form>

    <div class="form-footer">
      <div class="brand"><img src="./login-owl.png" alt="">CONVOY</div>
      <div class="copy" id="copyYear">All rights reserved.</div>
    </div>
  </div>
</div>

<script src="./login.js"></script>
</body>
</html>
