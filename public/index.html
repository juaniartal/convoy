<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convoy — Release Board</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="stylesheet" href="./styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect x='1' y='1' width='126' height='126' rx='22' fill='%23141419' stroke='%2326262e' stroke-width='2'/%3E%3Cg fill='%236d28d9'%3E%3Cpath d='M40 46 L56 48 L46 18 Z'/%3E%3Cpath d='M88 46 L72 48 L82 18 Z'/%3E%3C/g%3E%3Ccircle cx='64' cy='72' r='46' fill='%238b5cf6'/%3E%3Ccircle cx='48' cy='70' r='27' fill='%236d28d9'/%3E%3Ccircle cx='80' cy='70' r='27' fill='%236d28d9'/%3E%3Ccircle cx='48' cy='70' r='22' fill='%23fff'/%3E%3Ccircle cx='80' cy='70' r='22' fill='%23fff'/%3E%3Ccircle cx='51' cy='72' r='11' fill='%23141419'/%3E%3Ccircle cx='77' cy='72' r='11' fill='%23141419'/%3E%3Ccircle cx='55' cy='67' r='4' fill='%23fff'/%3E%3Ccircle cx='81' cy='67' r='4' fill='%23fff'/%3E%3Cpath d='M57 88 L71 88 L64 101 Z' fill='%23d99a3d'/%3E%3C/svg%3E">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="owlhead" viewBox="0 0 128 128">
    <g fill="#6d28d9"><path d="M40 46 L56 48 L46 18 Z"/><path d="M88 46 L72 48 L82 18 Z"/></g>
    <circle cx="64" cy="72" r="46" fill="#8b5cf6"/>
    <circle cx="48" cy="70" r="27" fill="#6d28d9"/><circle cx="80" cy="70" r="27" fill="#6d28d9"/>
    <circle cx="48" cy="70" r="22" fill="#fff"/><circle cx="80" cy="70" r="22" fill="#fff"/>
    <circle cx="51" cy="72" r="11" fill="#141419"/><circle cx="77" cy="72" r="11" fill="#141419"/>
    <circle cx="55" cy="67" r="4" fill="#fff"/><circle cx="81" cy="67" r="4" fill="#fff"/>
    <path d="M57 88 L71 88 L64 101 Z" fill="#d99a3d"/>
  </symbol>
</defs></svg>

<div class="topbar">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 128 128" aria-hidden="true"><use href="#owlhead"/></svg>
    <div>
      <span class="word">CONVOY</span>
      <div class="sub">Every pipeline, one screen, live.</div>
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="deploys" onclick="setTab('deploys')">Deploys</button>
  <button class="tab" data-tab="pipelines" onclick="setTab('pipelines')">Pipelines</button>
</div>

<div class="progress-track" id="progressTrack"></div>
<div class="summary" id="summary"></div>
<div id="grid"></div>

<footer>
  <svg width="20" height="20" viewBox="0 0 128 128" aria-hidden="true"><use href="#owlhead"/></svg>
  <span class="word">CONVOY</span>
  <span class="mono">— real-time GitHub Actions board</span>
</footer>

<script src="./app.js"></script>
</body>
</html>
