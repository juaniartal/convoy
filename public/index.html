<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convoy — Release Board</title>
<script>
// Runs before the stylesheet so the page paints in the right theme the
// first time, instead of flashing dark then switching to light (or vice
// versa). Falls back to the OS preference until the user picks explicitly.
(function () {
  var stored = localStorage.getItem('convoy-theme');
  var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = theme;
})();
</script>
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="stylesheet" href="./styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect x='1' y='1' width='126' height='126' rx='22' fill='%23141419' stroke='%2326262e' stroke-width='2'/%3E%3Cg fill='%236d28d9'%3E%3Cpath d='M38 44 L58 50 L45 14 Z'/%3E%3Cpath d='M90 44 L70 50 L83 14 Z'/%3E%3C/g%3E%3Ccircle cx='64' cy='72' r='46' fill='%238b5cf6' stroke='%236d28d9' stroke-width='2'/%3E%3Ccircle cx='46' cy='70' r='28' fill='%236d28d9'/%3E%3Ccircle cx='82' cy='70' r='28' fill='%236d28d9'/%3E%3Ccircle cx='46' cy='70' r='22' fill='%23fff'/%3E%3Ccircle cx='82' cy='70' r='22' fill='%23fff'/%3E%3Ccircle cx='49' cy='72' r='11.5' fill='%23141419'/%3E%3Ccircle cx='79' cy='72' r='11.5' fill='%23141419'/%3E%3Ccircle cx='53' cy='66' r='4' fill='%23fff'/%3E%3Ccircle cx='83' cy='66' r='4' fill='%23fff'/%3E%3Cpath d='M64 84 L75 97 L64 110 L53 97 Z' fill='%23d99a3d' stroke='%23b97f27' stroke-width='1.5'/%3E%3C/svg%3E">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="owlhead" viewBox="0 0 128 128">
    <g fill="#6d28d9"><path d="M38 44 L58 50 L45 14 Z"/><path d="M90 44 L70 50 L83 14 Z"/></g>
    <circle cx="64" cy="72" r="46" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
    <circle cx="46" cy="70" r="28" fill="#6d28d9"/><circle cx="82" cy="70" r="28" fill="#6d28d9"/>
    <circle cx="46" cy="70" r="22" fill="#fff"/><circle cx="82" cy="70" r="22" fill="#fff"/>
    <circle cx="49" cy="72" r="11.5" fill="#141419"/><circle cx="79" cy="72" r="11.5" fill="#141419"/>
    <circle cx="53" cy="66" r="4" fill="#fff"/><circle cx="83" cy="66" r="4" fill="#fff"/>
    <path d="M64 84 L75 97 L64 110 L53 97 Z" fill="#d99a3d" stroke="#b97f27" stroke-width="1.5" stroke-linejoin="round"/>
  </symbol>

  <!-- Sidebar icon set. Stroked vectors rather than emoji: an emoji renders
       differently on every OS, can't take the status colour the way a card
       does, and sits off the text baseline in a list. These inherit
       currentColor, so one rule paints a row green, red or amber. -->
  <symbol id="ico-all" viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M2 16l10 5 10-5"/><path d="M2 12l10 5 10-5"/></symbol>
  <symbol id="ico-arrived" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.2 2.4 2.4 4.6-4.9"/></symbol>
  <symbol id="ico-down" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></symbol>
  <symbol id="ico-rolling" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 4v5h-5"/></symbol>
  <symbol id="ico-staged" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></symbol>
  <symbol id="ico-star" viewBox="0 0 24 24"><path d="m12 3.6 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9L12 3.6Z"/></symbol>
  <symbol id="ico-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></symbol>
  <symbol id="ico-docs" viewBox="0 0 24 24"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v18H5.5A1.5 1.5 0 0 1 4 19.5Z"/><path d="M4 16.5h15"/></symbol>
  <symbol id="ico-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
  <symbol id="ico-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></symbol>
  <symbol id="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/></symbol>
  <symbol id="ico-caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
</defs></svg>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <svg width="28" height="28" viewBox="0 0 128 128" aria-hidden="true"><use href="#owlhead"/></svg>
      <div>
        <span class="word">CONVOY</span>
        <div class="sub">Every pipeline, live.</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="active" onclick="closeRepo()">
        <svg class="ico" aria-hidden="true"><use href="#ico-dashboard"/></svg><span>Dashboard</span>
      </button>
      <a href="https://github.com/juaniartal/convoy" target="_blank" rel="noopener">
        <svg class="ico" aria-hidden="true"><use href="#ico-docs"/></svg><span>Documentation</span>
      </a>
    </nav>

    <div class="sidebar-section" id="section-favorites">
      <button class="sidebar-section-title" onclick="toggleSection('section-favorites')" aria-expanded="true">
        <span>Favorites</span><svg class="caret" aria-hidden="true"><use href="#ico-caret"/></svg>
      </button>
      <div class="sidebar-section-body">
        <button class="sidebar-filter" data-state="star" id="favToggle" onclick="onToggleFavoritesOnly()">
          <svg class="ico" aria-hidden="true"><use href="#ico-star"/></svg><span>Favorites only</span>
        </button>
      </div>
    </div>

    <div class="sidebar-section" id="section-filter">
      <button class="sidebar-section-title" onclick="toggleSection('section-filter')" aria-expanded="true">
        <span>Status</span><svg class="caret" aria-hidden="true"><use href="#ico-caret"/></svg>
      </button>
      <div class="sidebar-section-body" id="sidebarFilters"></div>
    </div>

    <button class="sidebar-filter" id="logoutBtn" onclick="onLogout()" style="display:none">
      <svg class="ico" aria-hidden="true"><use href="#ico-logout"/></svg><span>Log out</span>
    </button>
    <button class="sidebar-filter theme-toggle" id="themeToggleBtn" onclick="toggleTheme()"></button>
  </aside>

  <main class="main">
    <div class="tabs">
      <button class="tab active" data-tab="deploys" onclick="setTab('deploys')">Deploys</button>
      <button class="tab" data-tab="pipelines" onclick="setTab('pipelines')">Pipelines</button>
      <button class="tab" data-tab="overview" onclick="setTab('overview')">Overview</button>
    </div>

    <div class="progress-track" id="progressTrack"></div>
    <div class="summary" id="summary"></div>
    <div id="grid"></div>
    <div id="overview"></div>

    <footer>
      <svg width="20" height="20" viewBox="0 0 128 128" aria-hidden="true"><use href="#owlhead"/></svg>
      <span class="word">CONVOY</span>
      <span class="mono">— real-time GitHub Actions board</span>
    </footer>
  </main>
</div>

<script src="./app.js"></script>
</body>
</html>
