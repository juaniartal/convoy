name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '24 3 * * 1' # weekly, catches newly-disclosed patterns even with no code changes

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v3
