name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '24 3 * * 1' # weekly, catches newly-disclosed patterns even with no code changes

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      # The analyze step's own telemetry call (GET a workflow run) needs
      # this too -- without it the scan itself succeeds but the job still
      # reports failure, which reads as a real problem when there isn't one.
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      # Uploading to the code-scanning UI needs that feature enabled on the
      # repo (paid on private repos) -- until then, this step still fails
      # even though the scan itself succeeded. continue-on-error keeps the
      # job green on that specific failure so it doesn't look like a real
      # problem; the SARIF artifact below is how results stay visible
      # regardless of whether the UI upload works.
      - uses: github/codeql-action/analyze@v3
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: ${{ github.workspace }}/../results/*.sarif
          retention-days: 7
