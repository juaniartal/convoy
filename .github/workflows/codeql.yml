name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '24 3 * * 1' # weekly, catches newly-disclosed patterns even with no code changes

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      # The analyze step's own telemetry call (GET a workflow run) needs
      # this too -- without it the scan itself succeeds but the job still
      # reports failure, which reads as a real problem when there isn't one.
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v3
