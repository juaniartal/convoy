apiVersion: v1
kind: Secret
metadata:
  name: {{ include "convoy.fullname" . }}
  labels:
    {{- include "convoy.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_ID: {{ .Values.github.appId | quote }}
  PRIVATE_KEY: {{ .Values.github.privateKey | quote }}
  WEBHOOK_SECRET: {{ .Values.github.webhookSecret | quote }}
  {{- if .Values.apiKey }}
  CONVOY_API_KEY: {{ .Values.apiKey | quote }}
  {{- end }}
