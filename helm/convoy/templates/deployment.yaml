apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "convoy.fullname" . }}
  labels:
    {{- include "convoy.labels" . | nindent 4 }}
spec:
  # Hard-pinned — Convoy's state is in-process memory, not a shared store.
  # See values.yaml for why this must stay at 1 in v1.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "convoy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "convoy.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: convoy
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          envFrom:
            - secretRef:
                name: {{ include "convoy.secretName" . }}
          {{- if .Values.convoyConfig }}
          env:
            - name: CONVOY_CONFIG_PATH
              value: /etc/convoy/convoy.yaml
          {{- end }}
          {{- if or .Values.convoyConfig (.Values.securityContext).readOnlyRootFilesystem }}
          volumeMounts:
            {{- if .Values.convoyConfig }}
            - name: config
              mountPath: /etc/convoy
              readOnly: true
            {{- end }}
            {{/* Convoy writes nothing itself, but a read-only root filesystem
                 leaves no scratch space at all, and a dependency reaching for
                 a temp file would fail in a way that is tedious to diagnose
                 from a crash loop. An emptyDir costs nothing and removes the
                 question. */}}
            {{- if (.Values.securityContext).readOnlyRootFilesystem }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.convoyConfig (.Values.securityContext).readOnlyRootFilesystem }}
      volumes:
        {{- if .Values.convoyConfig }}
        - name: config
          configMap:
            name: {{ include "convoy.fullname" . }}-config
        {{- end }}
        {{- if (.Values.securityContext).readOnlyRootFilesystem }}
        - name: tmp
          emptyDir: {}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
