# Example for teams using External Secrets Operator + Azure Key Vault (or
# adapt the storeRef/remoteRef shape for AWS Secrets Manager, GCP Secret
# Manager, Vault, etc. — ESO supports all of them the same way).
#
# Use this instead of Convoy's chart-managed Secret by setting, in your
# values file:
#   secret:
#     create: false
#     name: convoy-convoy   # must match metadata.name below
#
# Seed the three values into your vault first — see seed-keyvault.sh in this
# same folder for the az CLI commands.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: convoy
  namespace: devops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: <YOUR_CLUSTER_SECRET_STORE> # whatever ClusterSecretStore you already use for other apps
    kind: ClusterSecretStore
  target:
    name: convoy-convoy # must match Convoy's release name + "-convoy", or secret.name if you overrode it
    creationPolicy: Owner
  data:
    - secretKey: APP_ID
      remoteRef:
        key: convoy-github-app-id
    - secretKey: PRIVATE_KEY
      remoteRef:
        key: convoy-github-private-key
    - secretKey: WEBHOOK_SECRET
      remoteRef:
        key: convoy-github-webhook-secret
    # Uncomment if you're using the optional API key gate:
    # - secretKey: CONVOY_API_KEY
    #   remoteRef:
    #     key: convoy-api-key
