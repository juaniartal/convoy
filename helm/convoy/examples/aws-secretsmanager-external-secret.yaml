# Example for teams using External Secrets Operator + AWS Secrets Manager.
# Same shape as the Azure Key Vault example in this folder -- only the
# secretStoreRef changes, ESO handles the rest identically.
#
# Use this instead of Convoy's chart-managed Secret by setting, in your
# values file:
#   secret:
#     create: false
#     name: convoy-convoy   # must match metadata.name below
#
# Seed the three values into Secrets Manager first -- see
# seed-secretsmanager.sh in this same folder for the aws CLI commands.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: convoy
  namespace: devops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: <YOUR_CLUSTER_SECRET_STORE> # a ClusterSecretStore with provider.aws.service: SecretsManager
    kind: ClusterSecretStore
  target:
    name: convoy-convoy # must match Convoy's release name + "-convoy", or secret.name if you overrode it
    creationPolicy: Owner
  data:
    - secretKey: APP_ID
      remoteRef:
        key: convoy/github-app-id
    - secretKey: PRIVATE_KEY
      remoteRef:
        key: convoy/github-private-key
    - secretKey: WEBHOOK_SECRET
      remoteRef:
        key: convoy/github-webhook-secret
    # Uncomment if you're using the optional API key gate:
    # - secretKey: CONVOY_API_KEY
    #   remoteRef:
    #     key: convoy/api-key
    # Uncomment if you're using the optional OIDC/SSO login (all four
    # together, or omit all four):
    # - secretKey: CONVOY_OIDC_ISSUER_URL
    #   remoteRef:
    #     key: convoy/oidc-issuer-url
    # - secretKey: CONVOY_OIDC_CLIENT_ID
    #   remoteRef:
    #     key: convoy/oidc-client-id
    # - secretKey: CONVOY_OIDC_CLIENT_SECRET
    #   remoteRef:
    #     key: convoy/oidc-client-secret
    # - secretKey: CONVOY_OIDC_REDIRECT_URI
    #   remoteRef:
    #     key: convoy/oidc-redirect-uri
